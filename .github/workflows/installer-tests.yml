name: Installer tests

on:
  push:
    paths:
      - "install.ps1"
      - "uninstall.ps1"
      - "IndependentMonitorWorkspaces.ahk"
      - "tests/**"
      - ".github/workflows/installer-tests.yml"
  pull_request:
    paths:
      - "install.ps1"
      - "uninstall.ps1"
      - "IndependentMonitorWorkspaces.ahk"
      - "tests/**"
      - ".github/workflows/installer-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-powershell:
    name: Windows PowerShell 5.1
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run installer test matrix
        shell: powershell
        run: ./tests/Test-Installer.ps1

  powershell-7:
    name: PowerShell 7
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run installer test matrix
        shell: pwsh
        run: ./tests/Test-Installer.ps1
